<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景：ライトテーマの bg-color -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- 外周カード（border-color / bg-color、フラットなボーダーのみ） -->
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="#ffffff" stroke="#e1e5e9" stroke-width="2"/>

  <!-- アイコンタイル（card-bg の角丸タイルに link-color のマーク） -->
  <rect x="120" y="120" width="120" height="120" rx="24" fill="#f6f8fa"/>
  <g transform="translate(148, 148) scale(2.6)" fill="none" stroke="#0969da" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="5" cy="19" r="2" fill="#0969da" stroke="none"/>
    <path d="M5 11a8 8 0 0 1 8 8"/>
    <path d="M5 5a14 14 0 0 1 14 14"/>
  </g>

  <!-- サイト名（heading-color、太字・0.01em相当） -->
  <text x="120" y="330" font-size="76" font-weight="700" font-family="Helvetica Neue, Hiragino Sans, sans-serif" fill="#1f2328" letter-spacing="-1">
    Daily Tech News
  </text>

  <!-- サブキャッチ（text-secondary） -->
  <text x="122" y="382" font-size="28" font-weight="500" font-family="Hiragino Sans, Helvetica Neue, sans-serif" fill="#656d76">
    忙しいエンジニアのために。毎日サクッとキャッチアップ。
  </text>

  <!-- フッターの区切り線（rule-strong） -->
  <line x1="120" y1="470" x2="1080" y2="470" stroke="#1f2328" stroke-width="3"/>

  <!-- ドメイン表記（text-tertiary） -->
  <text x="120" y="504" font-size="22" font-weight="600" font-family="Helvetica Neue, sans-serif" fill="#8b949e">
    unsolublesugar.github.io/daily-tech-news
  </text>
</svg>
